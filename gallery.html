<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="background-gradient"></div>
  <div class="floating-balloons">

    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
  </div>

  <main class="page">
    <header class="site-header">
      <div class="site-header-inner">
        <a href="home.html" class="site-logo">For<br class="logo-br"> You<span> 🎂</span></a>
        <nav class="site-nav">
          <a href="timeline.html">Memories</a>
          <a href="letter.html">Letter</a>
          <a href="wishes.html">Wishes</a>
          <a href="gallery.html">Gallery</a>
        </nav>
      </div>
    </header>

    <section class="section section-gallery" id="gallery">
      <div class="section-header">
        <p class="section-overline">Gallery of us</p>
        <h2>Little Frames of Forever</h2>
        <p class="section-description">
          A few frozen seconds from a friendship that’s anything but still.
        </p>
      </div>

      <div class="gallery-grid">
        <figure class="gallery-item reveal">
          <img src="assets/photo7.jpg" alt="Gallery 1" />
          <figcaption>That time when we went to Nairamdal Camp. :)</figcaption>
        </figure>
        <figure class="gallery-item reveal delay-1">
          <img src="assets/photo10.jpg" alt="Gallery 2" />
          <figcaption>Remember Urlagiin Uzleg? Haha fun times.</figcaption>
        </figure>
        <figure class="gallery-item reveal delay-2">
          <img src="assets/photo9.jpg" alt="Gallery 3" />
          <figcaption>How can we forget about the slumber party? Haha.</figcaption>
        </figure>
        <figure class="gallery-item reveal delay-3">
          <img src="assets/photo8.jpg" alt="Gallery 4" />
          <figcaption>Our graduation vacation in Terelj!</figcaption>
        </figure>
      </div>
    </section>

    <footer class="footer">
      <p class="footer-text">
        These are just a few frames — the real gallery is in my head and my heart. 😊
      </p>
    </footer>
  </main>

  <script src="script.js"></script>

</html>
