<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday 🎂</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Shell: only the audio and iframe live here so audio never reloads */
    body.shell-page { margin: 0; padding: 0; overflow: hidden; height: 100vh; }
    #site-frame { display: block; width: 100%; height: 100%; border: none; }
    #shell-music-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: #fef3c7;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #shell-music-toggle:hover { background: rgba(30, 41, 59, 0.95); transform: scale(1.05); }
  </style>
</head>
<body class="shell-page">
  <audio id="ambient-audio" loop preload="metadata">
    <source src="assets/background.mp3" type="audio/mpeg" />
  </audio>
  <button type="button" id="shell-music-toggle" title="Toggle ambient music" aria-label="Toggle ambient music">🎵</button>
  <iframe id="site-frame" title="Birthday content"></iframe>
  <script>
    (function() {
      var frame = document.getElementById('site-frame');
      var params = new URLSearchParams(window.location.search);
      var page = params.get('page');
      frame.src = (page && /^[a-z0-9_-]+\.html$/i.test(page)) ? page : 'home.html';

      var audio = document.getElementById('ambient-audio');
      var btn = document.getElementById('shell-music-toggle');
      if (!audio) return;
      audio.volume = 0.4;
      function updateBtn(playing) {
        if (btn) {
          btn.textContent = playing ? '🔊' : '🎵';
          btn.title = playing ? 'Pause ambient music' : 'Play ambient music';
        }
      }
      function toggleAudio() {
        if (audio.paused) {
          audio.play().catch(function(){});
          try { localStorage.setItem('birthday-ambient-playing', '1'); } catch (e) {}
          updateBtn(true);
          return true;
        } else {
          audio.pause();
          try { localStorage.removeItem('birthday-ambient-playing'); } catch (e) {}
          updateBtn(false);
          return false;
        }
      }
      if (btn) {
        btn.addEventListener('click', function() { toggleAudio(); });
      }
      window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'birthday-ambient') return;
        if (e.data.action === 'toggle') {
          var playing = toggleAudio();
          try { e.source.postMessage({ type: 'birthday-ambient', playing: playing }, '*'); } catch (err) {}
        } else if (e.data.action === 'getState') {
          var playing = !audio.paused;
          try { e.source.postMessage({ type: 'birthday-ambient', playing: playing }, '*'); } catch (err) {}
        }
      });
      audio.play().then(function() {
        updateBtn(true);
        try { localStorage.setItem('birthday-ambient-playing', '1'); } catch (err) {}
      }).catch(function() {
        updateBtn(false);
      });
    })();
  </script>
</body>
</html>
